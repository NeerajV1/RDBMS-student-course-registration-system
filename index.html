<!DOCTYPE html>
<html>
<head>
    <title>College Management Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f8f9fa; }
        .grid { display: flex; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .btn-del { background: #dc3545; padding: 5px 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>College Management System</h1>
    <div class="grid">
        <div class="card">
            <h3>Add Record</h3>
            <input type="text" id="dept_name" placeholder="Department Name (For Dept)">
            <input type="text" id="dept_loc" placeholder="Location (For Dept)">
            <button onclick="addDept()" style="background:#28a745; margin-bottom: 20px;">Create Department (SQL INSERT)</button>
            <hr>
            <input type="email" id="email" placeholder="Student Email">
            <input type="password" id="pass" placeholder="Password">
            <input type="number" id="sem" placeholder="Semester">
            <input type="date" id="dob">
            <button onclick="addStudent()">Create Student (SQL INSERT)</button>
        </div>

        <div class="card">
            <h3>Database Tables</h3>
            <button onclick="fetchData()" style="background:#6c757d">Refresh Data (SQL SELECT)</button>
            <h4>Students</h4>
            <table id="sTable">
                <thead><tr><th>ID</th><th>Email</th><th>Sem</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        async function addDept() {
            const body = { dept_name: document.getElementById('dept_name').value, location: document.getElementById('dept_loc').value };
            const res = await fetch(`${API}/departments/`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            const data = await res.json();
            alert(data.message);
            fetchData();
        }

        async function addStudent() {
            const body = {
                email: document.getElementById('email').value,
                password: document.getElementById('pass').value,
                phoneno: "0000000000",
                semester: parseInt(document.getElementById('sem').value),
                dob: document.getElementById('dob').value
            };
            const res = await fetch(`${API}/students/`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            const data = await res.json();
            alert(data.message);
            fetchData();
        }

        async function deleteStudent(id) {
            const res = await fetch(`${API}/students/${id}`, { method: 'DELETE' });
            const data = await res.json();
            alert(data.message);
            fetchData();
        }

        async function fetchData() {
            const res = await fetch(`${API}/students/`);
            const students = await res.json();
            const tbody = document.querySelector("#sTable tbody");
            tbody.innerHTML = students.map(s => `
                <tr>
                    <td>${s.student_id}</td>
                    <td>${s.email}</td>
                    <td>${s.semester}</td>
                    <td><button class="btn-del" onclick="deleteStudent(${s.student_id})">Delete (SQL DELETE)</button></td>
                </tr>
            `).join('');
        }
        window.onload = fetchData;
    </script>
</body>
</html>
